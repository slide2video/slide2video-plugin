[project]
name = "slide2video-plugin-dev"
version = "0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "edge-tts>=7.3.1",
  "jsonschema>=4.23",
  "numpy>=1.26",
  "pillow>=10.0",
  "playwright>=1.45",
  "pymupdf>=1.24",
  "pyyaml>=6.0",
  "python-pptx>=1.0",
  "scipy>=1.11",
  "static-ffmpeg>=3.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["slide2video/scripts"]
testpaths = ["tests"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
