[project]
name = "daniellandi-plugins-dev"
version = "0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "playwright>=1.45",
  "pymupdf>=1.24",
  "python-pptx>=1.0",
  "scipy>=1.11",
  "static-ffmpeg>=3.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["lesson-videos/scripts"]
testpaths = ["tests"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
